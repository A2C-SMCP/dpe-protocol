[package]
name = "dpe-sdk"
description = "DPE 协议 Rust SDK：sans-IO 协议核心与传输适配（默认 reqwest / tokio）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme = "README.md"

[features]
# 默认提供 HTTP 传输适配；协议核心不依赖任何异步运行时，关掉默认 feature 也能编译（CI 有断言）
default = ["http"]
http = ["dep:reqwest", "dep:tokio", "dep:flate2", "dep:futures-util"]

[dependencies]
# 与 dpe-hash 锁步发布、精确同版本（版本串由 bump-my-version 与工作区版本一并维护）
dpe-hash.workspace = true
serde = { version = "1", features = ["derive"] }
# 清单与实例配置校验、数据模型（#20）都只处理 JSON 值（不做 JCS）。arbitrary_precision
# （越界数值保留字面量，1e400 可解析、`as_f64()` 返回 None）与 float_roundtrip（正确舍入）
# 是数值判定口径的前提：dpe-hash 也声明了这两个 feature（同一构建内统一生效），这里显式
# 声明把不变量放到使用点，避免 dpe-hash 依赖行变动时本 crate 静默改变判定（feature 可加性，
# 无副作用）。
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
# connector 契约 §4.1.1 子集 pattern 的匹配引擎：pattern 先转译为显式码点区间再交给 regex，
# 不依赖其 `\w`、`$` 等默认语义（转译先于编译）；子集结构上界在默认编译限额内的余量
# 由 scripts/pattern_budget 探针复测（§4.1.1 要求子集内任何 pattern 都必须被接受）。
regex = "1"
# 媒体来源适配（#24）的分块流式哈希：路径 / 流 / read_blob 来源算 `sha256:` 引用时不整读进内存。
# dpe-hash 只对外给整段字节的 `blob_ref`，增量哈希在这里做；与 dpe-hash 同一版本（锁文件已有）。
sha2 = "0.10"
# HTTP 传输适配（#22）。关掉默认 feature 后逐个显式选：
# - rustls-tls（webpki 根）而不是 native-tls：不依赖系统 OpenSSL、任意环境可编译，
#   信任根是随包发布的 Mozilla 根证书集——与 Python 侧 httpx（certifi 随包根）对等，
#   企业自签根需要替换客户端（两侧一样）；
# - **不开 gzip / deflate（响应解压）**：请求体 gzip 由 flate2 直接压（§7，规范要求的
#   那一半）；响应压缩不在 HTTP 绑定内，参考服务端也不压响应，而 reqwest 的解压链
#   （tower-http → async-compression → compression-codecs）当前要求 Rust ≥ 1.83、超出本
#   workspace 的 MSRV 1.80，为它牺牲 MSRV 或钉死旧版本都不值；不带 accept-encoding 时
#   合规服务端按 identity 应答，真遇到未经请求的压缩响应会如实报「响应不合规」；
# - **不开 system-proxy**：该 feature 除环境变量外还读 macOS / Windows 的系统代理设置，
#   会把流量静默路由进使用方看不到的代理（#132）。代理只来自环境变量，由本 crate 按固定
#   规则自行判定（src/proxy.rs，与 Python 侧同一张用例表），构造客户端时先 `no_proxy()`
#   关掉 reqwest 自身的探测、再显式挂上判定结果——即使依赖图里别的 crate 经 feature 合并
#   打开了 system-proxy，本客户端也不受影响；
# - 不开 http2：Python 侧 httpx 是纯 HTTP/1.1（无 h2 额外依赖），两侧保持同一形态；
# - 不开 charset / json：本适配只处理字节，编解码都在核心与 serde_json。
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "rustls-tls",
] }
# rt：异步读 blob 源进 spawn_blocking；time：按 Retry-After 等待；sync：capabilities 只协商一次
tokio = { version = "1", optional = true, features = ["rt", "time", "sync"] }
# 请求体 gzip（HTTP 绑定 §7）：确定性压缩（mtime=0），重发各轮复用同一份字节
flate2 = { version = "1", optional = true }
# 增量推送器（#23）的写操作并发：在调用方的同一个任务内有界并发（buffer_unordered），不经
# tokio::spawn——deliver 的 future 在 BlobProvider 加 Send（#131）之前不是 Send。只取组合器
# 本身（alloc），不开 std / async-await 宏等默认特性；reqwest 已间接依赖同一版本
futures-util = { version = "0.3", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
# 测试驱动：宏（#[tokio::test]）、多线程 flavor（并发首发只协商一次的用例）与暂停时钟
# （start_paused：断言等待值而不真等）
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
