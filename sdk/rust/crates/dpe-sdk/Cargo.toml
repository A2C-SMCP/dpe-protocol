[package]
name = "dpe-sdk"
description = "DPE 协议 Rust SDK：sans-IO 协议核心与传输适配（默认 reqwest / tokio）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
readme = "README.md"

[features]
# 默认提供 HTTP 传输适配；协议核心不依赖任何异步运行时，关掉默认 feature 也能编译（CI 有断言）
default = ["http"]
http = ["dep:reqwest", "dep:tokio"]

[dependencies]
# 与 dpe-hash 锁步发布、精确同版本（版本串由 bump-my-version 与工作区版本一并维护）
dpe-hash.workspace = true
serde = { version = "1", features = ["derive"] }
# 清单与实例配置校验只处理 JSON 值（不做 JCS）。arbitrary_precision（越界数值保留字面量，
# 1e400 可解析、`as_f64()` 返回 None）与 float_roundtrip（正确舍入）是数值判定口径的前提：
# dpe-hash 也声明了这两个 feature（同一构建内统一生效），这里显式声明把不变量放到使用点，
# 避免 dpe-hash 依赖行变动时本 crate 静默改变判定（feature 可加性，无副作用）。
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
# connector 契约 §4.1.1 子集 pattern 的匹配引擎：pattern 先转译为显式码点区间再交给 regex，
# 不依赖其 `\w`、`$` 等默认语义（转译先于编译）；子集结构上界在默认编译限额内的余量
# 由 scripts/pattern_budget 探针复测（§4.1.1 要求子集内任何 pattern 都必须被接受）。
regex = "1"
# 传输适配随 #22 落地；TLS 等 feature 细节届时再定
reqwest = { version = "0.12", optional = true, default-features = false }
tokio = { version = "1", optional = true, features = ["rt"] }
