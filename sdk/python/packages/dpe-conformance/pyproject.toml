[project]
name = "dpe-conformance"
version = "0.4.1-dev"
description = "DPE 服务端一致性跑分器：对任意 remote 黑盒运行协议检查，输出 JUnit XML 与执行/跳过计数"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# 仓库根 LICENSE 的副本（构建后端只收录包目录内的文件）
license-files = ["LICENSE"]
authors = [
    {name = "TuringFocus Team", email = "dev@turingfocus.cn"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    # 期望 hash 只依赖 dpe-hash（#26）：跑分器不依赖 dpe-sdk 与任何服务端实现
    "dpe-hash==0.4.1-dev",
    "httpx>=0.27,<1",
    # 套件以 pytest 实现（--section 过滤、skip 语义与 JUnit XML 直接复用其报告设施）。
    # 计数归章依赖 Node.location 的 rootpath 相对语义（pytest 9 已核实），锁主版本上界；
    # 升级 pytest 主版本时放开上界并重跑全套件。
    "pytest>=8.3,<10",
]

[project.scripts]
dpe-conformance = "dpe_conformance.cli:main"

[project.urls]
Homepage = "https://github.com/A2C-SMCP/dpe-protocol"
Documentation = "https://doc.turingfocus.cn/dpe/"
Repository = "https://github.com/A2C-SMCP/dpe-protocol"

[tool.uv.sources]
dpe-hash = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpe_conformance"]

# 测试以 workspace 的 dpe-sdk 参考服务端为自测对手（#16），不随 sdist 分发
[tool.hatch.build.targets.sdist]
exclude = ["tests"]
