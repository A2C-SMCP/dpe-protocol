[project]
name = "dpe-hash"
version = "0.2.1-dev"
description = "DPE hash 契约的独立 hash 核心：零运行时依赖、纯 Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# 仓库根 LICENSE 的副本（构建后端只收录包目录内的文件），测试断言两者一致
license-files = ["LICENSE"]
authors = [
    {name = "TuringFocus Team", email = "dev@turingfocus.cn"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# 零运行时依赖是硬约束（内核直接依赖本包），tools/check_packages.py 在 CI 中断言
dependencies = []

[project.urls]
Homepage = "https://github.com/A2C-SMCP/dpe-protocol"
Documentation = "https://doc.turingfocus.cn/dpe/"
Repository = "https://github.com/A2C-SMCP/dpe-protocol"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpe_hash"]

# 测试依赖 workspace 根的 conftest 与仓库 vectors/，不随 sdist 分发
[tool.hatch.build.targets.sdist]
exclude = ["tests"]
