# Git connector（connectors/git）的质量门禁：ruff / mypy --strict / pytest。
# connector 是与 sdk/python 独立的 uv 项目（自带 uv.lock，开发时用 path 源指向 SDK 的成员包），
# 因此单独一个 job；paths 同时匹配 connectors/git/** 与 sdk/python/**——SDK 的协议行为一变，
# 本 job 就会跑：锁文件里钉的是 SDK 的版本约束，SDK 升版后 --locked 失败即是「必须同步」的信号。
name: connector-git

on:
  push:
    branches: [main]
    paths:
      - "connectors/git/**"
      - "sdk/python/**"
      - ".github/workflows/connector-git.yml"
  pull_request:
    paths:
      - "connectors/git/**"
      - "sdk/python/**"
      - ".github/workflows/connector-git.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: connectors/git
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      # 测试现场构造 git 仓库（非 UTF-8 路径的用例只在 Linux 上生效），需要 git 可执行文件
      - run: git --version
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
