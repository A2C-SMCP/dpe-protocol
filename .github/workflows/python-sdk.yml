# Python SDK 质量门禁：先校验向量与生成器一致，再在 3.11 / 3.12 上跑 lint、类型检查、测试与打包约束。
# 同时作为可复用 workflow 被 release-python.yml 调用：发布必须先通过完整门禁。
name: python-sdk

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "vectors/**"
      - "scripts/gen_vectors.py"
      - "scripts/pattern_subset.py"
      - "Makefile"
      - ".github/workflows/python-sdk.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - "vectors/**"
      - "scripts/gen_vectors.py"
      - "scripts/pattern_subset.py"
      - "Makefile"
      - ".github/workflows/python-sdk.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 只取消同一 PR 的旧 run；main 与被 release 调用时（event_name 为 push）每次都跑完
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make check-vectors

  # 消费者锁文件守卫（#106）：以 path 引用 SDK 成员包的独立 uv 项目，其 uv.lock 钉着 SDK 版本，
  # SDK 升版后必须同步刷新（bump 的 pre_commit_hooks 会连带刷新并提交）。这里枚举仓库内全部已
  # 提交的 uv.lock 逐个校验：新增消费者零维护即被覆盖，漏刷在 SDK 侧 PR / 发版门禁即被拦住，
  # 而不是事后在 main 的 connector-git 上才炸。
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      # 显式 shell: bash 才带 -o pipefail：否则 git ls-files 失败时退出码会被循环覆盖，job 仍为绿色
      - shell: bash
        run: |
          git ls-files -z '*uv.lock' | while IFS= read -r -d '' lock; do
            echo "::group::$lock"
            uv lock --check --directory "$(dirname "$lock")"
            echo "::endgroup::"
          done

  test:
    needs: vectors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 上游自 v8 起不再提供浮动主版本标签
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  package:
    needs: vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 上游自 v8 起不再提供浮动主版本标签
        with:
          python-version: "3.12"
      - run: uv build --all-packages -o dist
      - run: uv run --no-project python tools/check_packages.py dist

  # 原位重算基准（#7）：只报告、不设门槛，结果写进 job summary
  bench:
    needs: vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 上游自 v8 起不再提供浮动主版本标签
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # 显式 shell: bash 才带 -o pipefail：否则基准失败时退出码被 tee 覆盖，job 仍为绿色
      - shell: bash
        run: uv run python tools/bench_hash.py | tee -a "$GITHUB_STEP_SUMMARY"
