# Python SDK 质量门禁：先校验向量与生成器一致，再在 3.11 / 3.12 上跑 lint、类型检查、测试与打包约束。
# 同时作为可复用 workflow 被 release-python.yml 调用：发布必须先通过完整门禁。
name: python-sdk

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "vectors/**"
      - "scripts/gen_vectors.py"
      - "scripts/pattern_subset.py"
      - "Makefile"
      - ".github/workflows/python-sdk.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - "vectors/**"
      - "scripts/gen_vectors.py"
      - "scripts/pattern_subset.py"
      - "Makefile"
      - ".github/workflows/python-sdk.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 只取消同一 PR 的旧 run；main 与被 release 调用时（event_name 为 push）每次都跑完
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make check-vectors

  # 消费者锁文件守卫（#106）：以 path 引用 SDK 成员包的独立 uv 项目，其 uv.lock 钉着 SDK 版本，
  # SDK 升版后必须同步刷新（bump 的 pre_commit_hooks 会连带刷新并提交）。这里枚举仓库内全部已
  # 提交的 uv.lock 逐个校验：新增消费者零维护即被覆盖，漏刷在 SDK 侧 PR / 发版门禁即被拦住，
  # 而不是事后在 main 的 connector-git 上才炸。
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      # 显式 shell: bash 才带 -o pipefail：否则 git ls-files 失败时退出码会被循环覆盖，job 仍为绿色
      - shell: bash
        run: |
          git ls-files -z '*uv.lock' | while IFS= read -r -d '' lock; do
            echo "::group::$lock"
            uv lock --check --directory "$(dirname "$lock")"
            echo "::endgroup::"
          done

  test:
    needs: vectors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 上游自 v8 起不再提供浮动主版本标签
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  package:
    needs: vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 上游自 v8 起不再提供浮动主版本标签
        with:
          python-version: "3.12"
      - run: uv build --all-packages -o dist
      - run: uv run --no-project python tools/check_packages.py dist

  # 一致性跑分器自检（#40）：与 test_cli 的全量用例不同，这里从**构建出的 wheel** 安装，跑分器
  # 与参考服务端各占一个 venv（跑分器单独安装即可用，漏声明的依赖不会被服务端的依赖掩盖），
  # 按 conformance/ci.md 描述的方式（CLI、JUnit、counts.json 断言）对参考服务端跑全部章节，
  # 拦下打包回归（套件、入口脚本、依赖声明）。全配置下不允许任何 skip：skip 被计为假绿。
  # 第三方依赖故意不按 uv.lock 锁定：模拟服务端仓库 pip install 时的真实解析。
  conformance:
    needs: vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 上游自 v8 起不再提供浮动主版本标签
        with:
          python-version: "3.12"
      - run: uv build --all-packages -o dist
      - name: 从 wheel 安装（不经 workspace，跑分器与参考服务端分开）
        run: |
          uv venv "$RUNNER_TEMP/conf"
          uv pip install --python "$RUNNER_TEMP/conf/bin/python" \
            dist/dpe_hash-*.whl dist/dpe_conformance-*.whl
          uv venv "$RUNNER_TEMP/server"
          uv pip install --python "$RUNNER_TEMP/server/bin/python" \
            dist/dpe_hash-*.whl "$(echo dist/dpe_sdk-*.whl)[server]"
      # 显式 shell: bash 才带 -o pipefail；参考服务端的身份、钩子、认证、契约与收小限额与 test_cli
      # 一致（改动须两处同步：dpe-conformance/tests/test_cli.py 的 _SERVER_ARGS /
      # _SINGLE_CONTRACT_ARGS 与 _write_config）。两轮（#56）：
      #   1. 全配置（--require-auth、同时声明 dpe1 与演练契约 dpe2）跑全部章节；
      #   2. 只声明 dpe1 跑 vectors 章——前提为「服务端未声明 dpe2」的向量用例在这里执行。
      # 零 skip 按两轮的并集判定：任一轮 skip 的用例必须在另一轮执行并通过。
      - name: 对参考服务端运行 dpe-conformance
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          run_pass() {  # $1 = 输出名；$2 = 额外的服务端参数（空格分隔）；其余 = 跑分器参数
            local name=$1 extra=$2; shift 2
            # 公告行经命名管道读取（阻塞读，超时即启动失败）；之后读端交给后台 cat 持续读走，
            # 服务端日后即使写 stdout 也不会因管道断开而崩溃
            rm -f "$name.fifo" && mkfifo "$name.fifo"
            "$RUNNER_TEMP/server/bin/python" -m dpe_sdk.testing --port 0 \
              --hooks /__hooks__ \
              --grant "Bearer full-auth" "*" --force "Bearer full-auth" \
              --grant "Bearer scoped-auth" "dpe://conf/scoped/" \
              --grant "Bearer no-force-auth" "*" \
              --require-auth $extra \
              --max-payload-bytes 65536 --page-max-bytes 262144 \
              --blob-max-bytes 131072 --blob-chunk-bytes 16384 > "$name.fifo" &
            local pid=$!
            exec 3< "$name.fifo"
            read -r -t 30 announce <&3
            cat <&3 > "$name.stdout" &
            exec 3<&-
            url=$(jq -er .url <<<"$announce")
            hooks=$(jq -er .hooks <<<"$announce")
            cat > dpe-conformance.toml <<EOF
          schema = 1

          [identities.full]
          authorization = "Bearer full-auth"

          [identities.scoped]
          authorization = "Bearer scoped-auth"
          prefix = "dpe://conf/scoped/"

          [identities.no-force]
          authorization = "Bearer no-force-auth"

          [hooks.self-write]
          http = "$hooks/self-write"

          [hooks.clock-advance]
          http = "$hooks/clock/advance"

          [hooks.inject-error]
          http = "$hooks/inject-error"
          EOF
            local status=0
            "$RUNNER_TEMP/conf/bin/dpe-conformance" "$url" "$@" \
              --junit-xml "$name.xml" --counts-json "$name.json" || status=$?
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            jq '.totals' "$name.json" | tee -a "$GITHUB_STEP_SUMMARY"
            jq -e '.totals | .failed == 0 and .errors == 0 and .collection_errors == 0 and .executed > 0' "$name.json"
            return $status
          }
          run_pass full "--contract dpe1 --contract dpe2"
          run_pass vectors-dpe1 "" --section vectors
          # 两轮并集零 skip：任一轮 skip 的用例必须在另一轮通过
          python3 - full.xml vectors-dpe1.xml <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          def outcomes(path):
              # 以 (classname, name) 为键：不同章节的同名用例不得互相覆盖
              result = {}
              for case in ET.parse(path).iter("testcase"):
                  tags = {child.tag for child in case} & {"skipped", "failure", "error"}
                  key = f"{case.get('classname')}::{case.get('name')}"
                  assert key not in result, f"JUnit 中有重复用例：{key}"
                  result[key] = next(iter(tags), "passed")
              return result

          first, second = (outcomes(path) for path in sys.argv[1:])
          uncovered = sorted({
              name
              for a, b in ((first, second), (second, first))
              for name, outcome in a.items()
              if outcome == "skipped" and b.get(name) != "passed"
          })
          if uncovered:
              sys.exit(f"两轮都未执行的用例：{uncovered}")
          print("两轮并集零 skip")
          EOF
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: |
            ${{ runner.temp }}/full.xml
            ${{ runner.temp }}/full.json
            ${{ runner.temp }}/vectors-dpe1.xml
            ${{ runner.temp }}/vectors-dpe1.json
          if-no-files-found: ignore

  # 原位重算基准（#7）：只报告、不设门槛，结果写进 job summary
  bench:
    needs: vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 上游自 v8 起不再提供浮动主版本标签
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # 显式 shell: bash 才带 -o pipefail：否则基准失败时退出码被 tee 覆盖，job 仍为绿色
      - shell: bash
        run: uv run python tools/bench_hash.py | tee -a "$GITHUB_STEP_SUMMARY"
