# Rust SDK 质量门禁：先校验向量与生成器一致，再跑 lint、测试（含 MSRV 1.80 矩阵）与打包检查。
# 同时作为可复用 workflow 被 release-rust.yml 调用：发布必须先通过完整门禁。
name: rust-sdk

on:
  push:
    branches: [main]
    paths:
      - "sdk/rust/**"
      - "sdk/testdata/**"
      - "vectors/**"
      - "scripts/gen_vectors.py"
      - "scripts/pattern_subset.py"
      - "Makefile"
      - ".github/workflows/rust-sdk.yml"
      # 集成测试的对手（#25）：Python 参考服务端变化时也要重跑 Rust 的 reference job
      - "sdk/python/packages/dpe-sdk/src/dpe_sdk/**"
      - "sdk/python/packages/dpe-hash/src/**"
      - "sdk/python/uv.lock"
      - "sdk/python/pyproject.toml"
      - "sdk/python/packages/*/pyproject.toml"
      # 对等场景的 Python 定义（#25）：一侧场景变了，另一侧要重跑以免悄悄漂移
      - "sdk/python/packages/dpe-sdk/tests/test_protocol_write_http.py"
      - "sdk/python/packages/dpe-sdk/tests/test_protocol_staging_http.py"
      - "sdk/python/packages/dpe-sdk/tests/test_media_http.py"
      - "sdk/python/packages/dpe-sdk/tests/test_transport_server.py"
      - "sdk/python/packages/dpe-sdk/tests/test_pusher.py"
      - "sdk/python/packages/dpe-sdk/tests/test_proxy.py"
  pull_request:
    paths:
      - "sdk/rust/**"
      - "sdk/testdata/**"
      - "vectors/**"
      - "scripts/gen_vectors.py"
      - "scripts/pattern_subset.py"
      - "Makefile"
      - ".github/workflows/rust-sdk.yml"
      # 集成测试的对手（#25）：Python 参考服务端变化时也要重跑 Rust 的 reference job
      - "sdk/python/packages/dpe-sdk/src/dpe_sdk/**"
      - "sdk/python/packages/dpe-hash/src/**"
      - "sdk/python/uv.lock"
      - "sdk/python/pyproject.toml"
      - "sdk/python/packages/*/pyproject.toml"
      # 对等场景的 Python 定义（#25）：一侧场景变了，另一侧要重跑以免悄悄漂移
      - "sdk/python/packages/dpe-sdk/tests/test_protocol_write_http.py"
      - "sdk/python/packages/dpe-sdk/tests/test_protocol_staging_http.py"
      - "sdk/python/packages/dpe-sdk/tests/test_media_http.py"
      - "sdk/python/packages/dpe-sdk/tests/test_transport_server.py"
      - "sdk/python/packages/dpe-sdk/tests/test_pusher.py"
      - "sdk/python/packages/dpe-sdk/tests/test_proxy.py"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 只取消同一 PR 的旧 run；main 与被 release 调用时（event_name 为 push）每次都跑完
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make check-vectors

  lint:
    needs: vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    needs: vectors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.80.0", "stable"]
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked
      # sans-IO 核心的机械防线（plan §10）：关掉默认 feature 也要能编译，且依赖树里没有异步运行时
      - if: matrix.toolchain == 'stable'
        run: |
          cargo check -p dpe-sdk --no-default-features --locked
          cargo tree -p dpe-sdk --no-default-features --locked -e normal --prefix none > /tmp/deps.txt
          if grep -Eq '^(tokio|reqwest) v' /tmp/deps.txt; then
            echo "::error::sans-IO 核心不得依赖 tokio / reqwest"
            exit 1
          fi

  package:
    needs: vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: dpe-hash 打包与发布面演练（完整 dry-run）
        run: cargo publish --dry-run -p dpe-hash --locked
      # dpe-sdk 依赖的 dpe-hash 尚未发布到 crates.io 时，cargo 连发布面都无法准备
      # （no matching package named `dpe-hash` found）；完整 dry-run 顺延到 dpe-hash 首发
      # 之后（#19），发布顺序由 release-rust.yml 保证（先 dpe-hash 后 dpe-sdk）。
      - name: dpe-sdk 打包面检查（依赖发布前可用）
        run: cargo package --list -p dpe-sdk

  # 对 Python 参考服务端跑同一场景集（#25，北极星重点 2「两个对等 SDK 对同一参考服务端运行
  # 同一场景集」）：子进程 `python -m dpe_sdk.testing` 由 DPE_REFERENCE_SERVER 给出；
  # DPE_REFERENCE_REQUIRED=1 让缺命令时直接失败，CI 里不会静默跳过
  reference:
    needs: vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@v10.2.0  # 与 python-sdk.yml 同版本
        with:
          python-version: "3.12"
      - name: 参考服务端环境
        working-directory: sdk/python
        run: uv sync --locked
      - name: 对参考服务端的集成场景
        working-directory: sdk/rust
        env:
          DPE_REFERENCE_SERVER: uv run --project ../python --frozen python -m dpe_sdk.testing
          DPE_REFERENCE_REQUIRED: "1"
        run: >-
          cargo test --locked -p dpe-sdk
          --test reference_write --test reference_staging
          --test reference_media --test reference_transport
          --test reference_pusher
          --test reference_delta

  # 原位重算基准（#19，对等 Python 的 bench job）：只报告、不设门槛，结果写进 job summary
  bench:
    needs: vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      # 显式 shell: bash 才带 -o pipefail：否则基准失败时退出码被 tee 覆盖，job 仍为绿色
      - shell: bash
        run: cargo run --release -p dpe-hash --example bench_hash --locked | tee -a "$GITHUB_STEP_SUMMARY"
