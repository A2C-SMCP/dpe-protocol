[project]
name = "dpe-protocol"
version = "0.1.7-dev"
description = "DPE (Document / Page / Element) Protocol Specification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "TuringFocus Team", email = "dev@turingfocus.cn"}
]

[project.urls]
Homepage = "https://github.com/A2C-SMCP/dpe-protocol"
Documentation = "https://doc.turingfocus.cn/dpe/"
Repository = "https://github.com/A2C-SMCP/dpe-protocol"

# 本仓库根目录不是可安装的包（SDK 在 sdk/ 下各自独立打包），只用 uv 管理文档工具链
[tool.uv]
package = false

[dependency-groups]
docs = [
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.7.0",
    "mike>=2.1.0",
    "invoke>=2.2.0",
    "paramiko>=3.4.0",
    "bump-my-version>=0.28.0",
]

# bump-my-version 配置
# 这里的版本是「规范文档发布版本」，与协议版本（DPE v1）、hash 契约版本（契约 1 / dpe1:）是三个独立的轴
[tool.bumpversion]
current_version = "0.1.7-dev"
# 开发中版本序列化为 X.Y.Z-dev（未发布）；发布时把 pre_l 推到 final（optional_value）即去掉后缀落到 X.Y.Z
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:-(?P<pre_l>dev))?"
serialize = [
    "{major}.{minor}.{patch}-{pre_l}",
    "{major}.{minor}.{patch}",
]
commit = true
tag = true
tag_name = "v{new_version}"
# uv.lock 里的项目版本是 PEP 440 规范化形式（0.1.0-dev → 0.1.0.dev0），无法用 search/replace 维护，改由 uv lock 重算
pre_commit_hooks = ["uv lock --quiet", "git add uv.lock"]

# 两态预发布标签：dev = 开发中（未发布，版本串带 -dev）；final = 已发布（optional_value，不出现在版本串）
# 开周期：bump major/minor/patch → 低位归零且 pre_l 归 dev，得 X.Y.Z-dev
# 发布：  bump pre_l（dev → final）→ 去掉 -dev，得 X.Y.Z
[tool.bumpversion.parts.pre_l]
values = ["dev", "final"]
optional_value = "final"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "mkdocs.yml"
search = "本文档版本：{current_version}"
replace = "本文档版本：{new_version}"

[[tool.bumpversion.files]]
filename = "website/index.md"
search = "当前文档版本：**{current_version}**"
replace = "当前文档版本：**{new_version}**"

[[tool.bumpversion.files]]
filename = "README.md"
search = "**文档版本**：{current_version}"
replace = "**文档版本**：{new_version}"

[[tool.bumpversion.files]]
filename = "CLAUDE.md"
search = "**当前文档版本**：{current_version}"
replace = "**当前文档版本**：{new_version}"
